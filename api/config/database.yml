default: &default
  adapter: mysql2
  encoding: utf8mb4
  host: <%= ENV.fetch("DB_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DB_PORT", 3306) %>
  username: <%= ENV.fetch("DB_USER", "root") %>
  password: <%= ENV.fetch("DB_PASSWORD", "") %>
  pool: <%= ENV.fetch("DB_POOL") { ENV.fetch("RAILS_MAX_THREADS", 5) } %>

development:
  <<: *default
  database: pixel_canvas_development

test:
  <<: *default
  database: pixel_canvas_test
  pool: 10

production:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "pixel_canvas_production") %>
